<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Hands-On Machine Learning Notes - Arabic and English study notes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="55%" stop-color="#0a3d62"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 54px 'JetBrains Mono', 'Courier New', monospace; fill: url(#t); }
      .sub   { font: 500 20px 'JetBrains Mono', 'Courier New', monospace; fill: #8b949e; }
      .tag   { font: 700 18px 'JetBrains Mono', 'Courier New', monospace; fill: #58a6ff; opacity: 0; animation: cycle 12s infinite; }
      .a1 { animation-delay: 0s; } .a2 { animation-delay: 3s; } .a3 { animation-delay: 6s; } .a4 { animation-delay: 9s; }
      @keyframes cycle { 0% {opacity:0;} 3% {opacity:1;} 22% {opacity:1;} 25% {opacity:0;} 100% {opacity:0;} }
      .bar { transform-origin: bottom; animation: grow 4s ease-in-out infinite; }
      .b2 { animation-delay: .5s; } .b3 { animation-delay: 1s; } .b4 { animation-delay: 1.5s; } .b5 { animation-delay: 2s; }
      @keyframes grow { 0%,100% { opacity:.25; } 50% { opacity:.85; } }
    </style>
  </defs>
  <rect width="1000" height="240" fill="url(#bg)"/>
  <rect width="1000" height="240" fill="url(#grid)"/>

  <!-- book-like bars decoration -->
  <g fill="#58a6ff">
    <rect class="bar" x="790" y="60" width="26" height="130" rx="3"/>
    <rect class="bar b2" x="826" y="40" width="26" height="150" rx="3"/>
    <rect class="bar b3" x="862" y="75" width="26" height="115" rx="3"/>
    <rect class="bar b4" x="898" y="50" width="26" height="140" rx="3"/>
    <rect class="bar b5" x="934" y="85" width="26" height="105" rx="3"/>
  </g>

  <text class="title" x="50" y="100">Hands-On ML Notes</text>
  <text class="sub" x="52" y="140">Study notes in Arabic + English | 3rd Edition</text>
  <g transform="translate(52,195)">
    <text class="tag a1">&gt; Organized chapter by chapter</text>
    <text class="tag a2">&gt; Equations, diagrams and review questions</text>
    <text class="tag a3">&gt; Written while learning, checked against the book</text>
    <text class="tag a4">&gt; Built to help you revise fast</text>
  </g>
</svg>
